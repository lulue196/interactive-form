  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="mb-4">Interactive Web Form</h3>
          <!-- Username -->
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" />
            <small id="usernameError" class="error-text"></small>
          </div>
          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" />
            <small id="emailError" class="error-text"></small>
          </div>
          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" />
            <small id="passwordError" class="error-text"></small>
          </div>
          <!-- Confirm Password -->
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" />
            <small id="confirmPasswordError" class="error-text"></small>
          </div>
          <!-- Interesting Topics -->
          <div class="mb-3">
            <label class="form-label fw-bold">Interesting Topics <small id="topicError" class="error-text"></small></label>
            <div class="form-check">
              <input
                class="form-check-input topic"
                type="checkbox"
                id="topic1"
                value="HTML"
              />
              <label class="form-check-label" for="topic1">HTML</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input topic"
                type="checkbox"
                id="topic2"
                value="CSS"
              />
              <label class="form-check-label" for="topic2">CSS</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input topic"
                type="checkbox"
                id="topic3"
                value="JavaScript"
              />
              <label class="form-check-label" for="topic3">JavaScript</label>
            </div>
          </div>
          <!-- Gender -->
          <div class="mb-3">
            <label class="form-label fw-bold">Gender <small id="genderError" class="error-text"></small></label>
            <select id="gender" class="form-select">
              <option>--</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
          <!-- Submit -->
          <button id="submitBtn" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js">

    </script>
    <script>
$(document).ready(function () {

    $("#submitBtn").on("click", function () {

        let valid = true;

        $(".form-control").css("border-color", "");
        $(".error-text").text("");

        function checkEmpty(input, error) {
            if ($(input).val().trim() == "") {
                $(input).css("border-color", "red");
                $(error).text("This field must not be empty");
                valid = false;
            }
        }

        checkEmpty("#username", "#usernameError");
        checkEmpty("#email", "#emailError");
        checkEmpty("#password", "#passwordError");
        checkEmpty("#confirmPassword", "#confirmPasswordError");

        if ($("#password").val() != "" &&
            $("#confirmPassword").val() != "" &&
            $("#password").val() != $("#confirmPassword").val()) {

            $("#confirmPassword").css("border-color", "red");
            $("#confirmPasswordError").text("Confirmed password mismatched the password");
            valid = false;
        }

        if ($(".topic:checked").length == 0) {
            $("#topicError").text("At least one topic must be selected");
            valid = false;
        }

        if ($("#gender").val() == "--") {
            $("#genderError").text("Please choose your gender");
            valid = false;
        }

        if (valid) {
            alert("Form submitted successfully!");
        }

    });

});
</script>
